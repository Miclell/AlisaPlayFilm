name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    strategy:
      matrix:
        platform: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - platform: windows-latest
            rid: win-x64
            target_framework: net9.0-windows
            binary_name: AlisaPlayFilm.exe
            asset_name: AlisaPlayFilm-Windows-x64.exe
            platform_package: Eto.Platform.Windows
            platform_version: 2.10.2
          - platform: ubuntu-latest
            rid: linux-x64
            target_framework: net9.0
            binary_name: AlisaPlayFilm
            asset_name: AlisaPlayFilm-Linux-x64
            platform_package: Eto.Platform.Gtk
            platform_version: 2.10.2
          - platform: macos-latest
            rid: osx-x64
            target_framework: net9.0
            binary_name: AlisaPlayFilm
            asset_name: AlisaPlayFilm-macOS-x64
            platform_package: Eto.Platform.Mac64
            platform_version: 2.10.2

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build and Publish
        shell: bash
        run: |
          dotnet publish src/Tray.App/Tray.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:TargetFrameworkOverride=${{ matrix.target_framework }} \
            -p:PlatformPackage=${{ matrix.platform_package }} \
            -p:EtoVersion=${{ matrix.platform_version }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          mv publish/${{ matrix.rid }}/${{ matrix.binary_name }} artifacts/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-binary
          path: artifacts/${{ matrix.asset_name }}
          retention-days: 1

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}